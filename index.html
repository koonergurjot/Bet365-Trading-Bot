<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bet365 Edge Brain</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Application header">
        <div>
          <p class="eyebrow">Recommendation engine v0.1</p>
          <h1>Bet365 Edge Brain</h1>
        </div>
        <div class="status-strip" aria-label="Data quality status">
          <span id="snapshotAge">Snapshot: loading</span>
          <span id="marketCount">Markets: 0</span>
          <span id="signalCount">Signals: 0</span>
        </div>
      </section>

      <section class="workspace-grid">
        <aside class="panel controls-panel" aria-label="Engine controls">
          <h2>Engine Controls</h2>
          <label>
            Bankroll
            <input id="bankrollInput" type="number" min="1" step="50" value="1000" />
          </label>
          <label>
            Minimum expected value
            <input id="minEvInput" type="number" step="0.01" value="0.03" />
          </label>
          <label>
            Minimum confidence
            <input id="minConfidenceInput" type="number" min="0" max="1" step="0.05" value="0.55" />
          </label>
          <label>
            Max bankroll stake
            <input id="maxStakeInput" type="number" min="0.001" max="0.1" step="0.001" value="0.02" />
          </label>
          <button id="runButton" type="button">Run Recommendations</button>
          <button id="loadSampleButton" type="button" class="secondary">Reload Sample Data</button>
        </aside>

        <section class="panel table-panel" aria-label="Recommendation results">
          <div class="panel-heading">
            <h2>Signals</h2>
            <span id="engineSummary">Waiting for data</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Bet</th>
                  <th>Bet365</th>
                  <th>Fair</th>
                  <th>EV</th>
                  <th>Stake</th>
                  <th>Risk</th>
                  <th>Data</th>
                </tr>
              </thead>
              <tbody id="resultsBody"></tbody>
            </table>
          </div>
        </section>
      </section>

      <section class="panel inspector-panel" aria-label="Market editor">
        <div class="panel-heading">
          <h2>Market Snapshot JSON</h2>
          <span>Paste normalized provider data here while the backend adapters are being built.</span>
        </div>
        <textarea id="snapshotEditor" spellcheck="false"></textarea>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
